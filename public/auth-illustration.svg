<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 900" preserveAspectRatio="xMidYMid slice">
<style>
@keyframes pfFlow{to{stroke-dashoffset:-24}}
@keyframes pfPulse{0%{transform:scale(.7);opacity:.9}100%{transform:scale(1.9);opacity:0}}
@keyframes pfBeam{0%,100%{opacity:.35}50%{opacity:1}}
.pf-links line{stroke-dasharray:6 6;animation:pfFlow 2.4s linear infinite}
.pf-links line:nth-child(2n){animation-duration:3.2s;animation-direction:reverse}
.pf-flow{animation:pfFlow 1.2s linear infinite}
.pf-pulse{transform-box:fill-box;transform-origin:center;animation:pfPulse 2.2s ease-out infinite}
.pf-pulse-late{animation-delay:1.1s}
.pf-pulse-mid{animation-delay:.6s}
.pf-beam{animation:pfBeam 2.4s ease-in-out infinite}
@media (prefers-reduced-motion: reduce){.pf-links line,.pf-flow,.pf-pulse,.pf-beam{animation:none}}
</style>
